<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-blob bg-blob-a" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-b" aria-hidden="true"></div>

    <main class="page">
      <nav class="page-nav">
        <a class="nav-link" href="/help">Help</a>
      </nav>

      <header class="hero">
        <h1>Chat Room</h1>
        <p class="tagline">Real-time rooms with Socket.IO — join a channel and chat live</p>
      </header>

      <section class="card setup">
        <label class="field">
          <span class="field-label">Display name</span>
          <input type="text" id="nickname" maxlength="40" placeholder="Your name" />
        </label>
        <label class="field">
          <span class="field-label">Room</span>
          <input type="text" id="room" maxlength="40" placeholder="e.g. lobby" />
        </label>
        <button type="button" id="btn-join" class="btn btn-primary">Join room</button>
        <p id="self-badge" class="self-badge" hidden aria-live="polite"></p>
        <p id="room-status" class="room-status" aria-live="polite"></p>
      </section>

      <section class="card chat" id="chat-panel" hidden>
        <ul id="messages" class="messages" aria-live="polite"></ul>
        <form id="send-form" class="send-row">
          <input type="text" id="message-input" maxlength="500" placeholder="Type a message…" autocomplete="off" />
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
        <p id="error-text" class="error" role="alert" hidden></p>
      </section>

      <section class="card log" id="log-panel" hidden>
        <h2 class="log-title">Presence (secret channel)</h2>
        <ul id="log-events" class="log-events"></ul>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/session-persist.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
